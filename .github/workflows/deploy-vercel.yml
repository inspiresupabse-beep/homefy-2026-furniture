name: Deploy to Vercel

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  VERCEL_ORG_ID: team_XhEbXsVrI7jEkzMZlbcMZO03

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to production
        run: vercel deploy --prod --yes --name homefy-2026-axys --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
