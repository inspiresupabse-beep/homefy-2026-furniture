name: Deploy to Vercel

# Homefy only — project homefy-2026-axys (furniture.teamhomefy.in)
# Do not change org/project IDs to other Vercel accounts.

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  VERCEL_ORG_ID: team_XhEbXsVrI7jEkzMZlbcMZO03
  VERCEL_PROJECT_ID: prj_7Ye9wpI5A29sfz8lpYQvhOy6AuvM

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for production
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
