name: Deploy to Vercel

# Homefy only — project homefy-2026-axys (furniture.teamhomefy.in)
# Do not change org/project IDs to other Vercel accounts.

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  VERCEL_ORG_ID: team_XhEbXsVrI7jEkzMZlbcMZO03
  VERCEL_PROJECT_ID: prj_7Ye9wpI5A29sfz8lpYQvhOy6AuvM

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Vercel Production
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: team_XhEbXsVrI7jEkzMZlbcMZO03
          vercel-project-id: prj_7Ye9wpI5A29sfz8lpYQvhOy6AuvM
          vercel-args: "--prod"
          working-directory: ./
